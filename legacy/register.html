<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — Study Gen AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <span class="logo-icon">🤖</span>
                Study Gen AI
            </a>
            <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation">☰</button>
            <div class="navbar-links" id="navbarLinks">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="active">Register</a>
            </div>
        </div>
    </nav>

    <!-- ==================== REGISTER FORM ==================== -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">🤖📚</div>
                <h1>Study Gen AI</h1>
                <p>Create Your Student Account</p>
            </div>

            <!-- Alert message area -->
            <div class="alert alert-error" id="registerAlert"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    <div class="form-error" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@example.com" required>
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                    <div class="form-error" id="passwordError"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="branch">Branch</label>
                        <select id="branch" name="branch" required>
                            <option value="">Select Branch</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="form-error" id="branchError"></div>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <select id="semester" name="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                        <div class="form-error" id="semesterError"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                    Register
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="container">
            <p><span class="footer-brand">Study Gen AI</span> © 2026</p>
            <p>AI Powered Student Learning Assistant</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        // Mobile navigation toggle
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('show');
        });
    </script>

</body>
</html>
