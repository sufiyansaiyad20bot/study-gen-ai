<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — Study Gen AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <span class="logo-icon">🤖</span>
                Study Gen AI
            </a>
            <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation">☰</button>
            <div class="navbar-links" id="navbarLinks">
                <a href="index.html">Home</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <!-- ==================== LOGIN FORM ==================== -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">🤖📚</div>
                <h1>Study Gen AI</h1>
                <p>Student Login</p>
            </div>

            <!-- Alert message area -->
            <div class="alert alert-error" id="loginAlert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@example.com" required>
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <div class="form-error" id="passwordError"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    Login
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="container">
            <p><span class="footer-brand">Study Gen AI</span> © 2026</p>
            <p>AI Powered Student Learning Assistant</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        // Mobile navigation toggle
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('show');
        });
    </script>

</body>
</html>
