<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Notes — Study Gen AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">
                <span class="logo-icon">🤖</span>
                Study Gen AI
            </a>
            <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation">☰</button>
            <div class="navbar-links" id="navbarLinks">
                <a href="dashboard.html">Dashboard</a>
                <a href="upload.html">Upload Notes</a>
                <a href="chatbot.html">Chat</a>
                <a href="quiz.html">Quiz</a>
                <a href="revision.html" class="active">Revision</a>
                <a href="#" id="logoutBtn" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <!-- ==================== REVISION CONTENT ==================== -->
    <main class="main-content">
        <div class="container">
            <div class="revision-container">

                <div class="page-header">
                    <h1>📚 Revision Notes</h1>
                    <p>Generate concise revision notes from your study material</p>
                </div>

                <!-- Alert message area -->
                <div class="alert alert-error" id="revisionAlert"></div>

                <!-- Revision generation form -->
                <div class="quiz-form">
                    <div class="form-group">
                        <label for="revisionTopic">Topic</label>
                        <input type="text" id="revisionTopic" placeholder="e.g. Operating Systems" required>
                    </div>

                    <button class="btn btn-primary btn-block" id="generateRevisionBtn">
                        Generate Revision Notes
                    </button>
                </div>

                <!-- Revision notes will be rendered here -->
                <div id="revisionNotes"></div>

            </div>
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="container">
            <p><span class="footer-brand">Study Gen AI</span> © 2026</p>
            <p>AI Powered Student Learning Assistant</p>
        </div>
    </footer>

    <script src="js/revision.js"></script>
    <script>
        // Mobile navigation toggle
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('show');
        });
    </script>

</body>
</html>
